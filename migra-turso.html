<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migrazione dati a Turso</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f3ff;font-family:system-ui,-apple-system,sans-serif;color:#21183d;padding:20px;box-sizing:border-box}.box{width:min(560px,100%);background:#fff;border:1px solid #ddd6fe;border-radius:22px;padding:28px;box-shadow:0 18px 45px rgba(76,29,149,.14)}h1{font-size:1.45rem;margin:0 0 10px}p{line-height:1.55;color:#625a75}.note{background:#fef3c7;color:#854d0e;padding:12px;border-radius:12px;font-size:.9rem}label{display:block;font-weight:750;margin:20px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1.5px solid #c4b5fd;border-radius:11px;font:inherit}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:11px;background:#7c3aed;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#result{display:none;margin-top:16px;padding:14px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:.88rem}.ok{display:block!important;background:#dcfce7;color:#166534}.err{display:block!important;background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<main class="box">
<h1>Trasferimento dati Firebase → Turso</h1>
<p>Questa pagina copia utenti, prenotazioni, impostazioni e altri dati nel nuovo database. Il vecchio database non verrà cancellato.</p>
<div class="note">Esegui l’operazione una sola volta. Non chiudere la pagina finché non compare il messaggio verde.</div>
<label for="secret">MIGRATION_SECRET</label>
<input id="secret" type="password" autocomplete="off" placeholder="Incolla il valore creato su Netlify">
<button id="go" type="button">Avvia migrazione</button>
<div id="result"></div>
</main>
<script>
const button=document.getElementById('go');
const result=document.getElementById('result');
button.onclick=async()=>{
 const secret=document.getElementById('secret').value.trim();
 if(!secret){result.className='err';result.textContent='Incolla prima il MIGRATION_SECRET.';return;}
 button.disabled=true;button.textContent='Migrazione in corso… attendi';
 result.className='';result.style.display='block';result.textContent='Sto copiando i dati. Non chiudere questa pagina.';
 try{
  const response=await fetch('/.netlify/functions/migrate-firestore-to-turso',{method:'POST',headers:{'x-migration-secret':secret}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.ok) throw new Error(data.error||('Errore '+response.status));
  result.className='ok';
  result.textContent='✅ MIGRAZIONE COMPLETATA\n\nDocumenti copiati: '+(data.totalDocuments??'OK')+'\n\nOra puoi accedere al sito e controllare utenti e prenotazioni.';
  document.getElementById('secret').value='';
 }catch(error){
  result.className='err';result.textContent='❌ Migrazione non riuscita: '+error.message+'\n\nNon sono stati cancellati dati. Controlla le variabili Netlify e riprova.';
 }finally{button.disabled=false;button.textContent='Avvia migrazione';}
};
</script>

</html>
